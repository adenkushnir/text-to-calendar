# Builds Datebook and runs its unit tests on every pull request and push to main, and keeps the debug app to download
name: Android
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build the debug app
        run: ./gradlew test assembleDebug --console=plain
      - name: Keep the debug app
        uses: actions/upload-artifact@v4
        with:
          name: datebook-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
